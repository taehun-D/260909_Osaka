<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 오사카 쇼핑 앱 아이콘 — 직접 그린 오리지널 고양이
       귀엽게 보이는 요소: 큰 머리, 작고 둥근 귀, 아래쪽에 크게 벌어진 눈,
       하이라이트 두 개, 넓은 볼터치, 아주 작은 코와 입 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#345A8E"/>
      <stop offset="1" stop-color="#1E3B64"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EFF2F6"/>
    </linearGradient>
    <radialGradient id="blush">
      <stop offset="0" stop-color="#F79A92" stop-opacity=".95"/>
      <stop offset="1" stop-color="#F79A92" stop-opacity="0"/>
    </radialGradient>
    <!-- 반짝임 -->
    <g id="spark">
      <path d="M0-1Q.14-.14 1 0 .14.14 0 1-.14.14-1 0-.14-.14 0-1Z"/>
    </g>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- 배경 반짝임 -->
  <g fill="#FFFFFF" opacity=".22">
    <use href="#spark" transform="translate(84 132) scale(21)"/>
    <use href="#spark" transform="translate(432 178) scale(15)"/>
    <use href="#spark" transform="translate(414 408) scale(12)"/>
    <use href="#spark" transform="translate(74 396) scale(9)"/>
  </g>

  <g transform="translate(256 252) scale(1.04) translate(-256 -256)">

    <!-- 귀 — 작고 둥글게 -->
    <g stroke="#1E3B64" stroke-width="17" stroke-linejoin="round">
      <path d="M150 232 L138 142 L226 184 Z" fill="url(#fur)"/>
      <path d="M362 232 L374 142 L286 184 Z" fill="url(#fur)"/>
    </g>
    <path d="M160 214 L152 168 L198 190 Z" fill="#F3ABA4"/>
    <path d="M352 214 L360 168 L314 190 Z" fill="#F3ABA4"/>

    <!-- 얼굴 — 세로보다 가로가 넓어 통통하게 -->
    <ellipse cx="256" cy="304" rx="160" ry="146" fill="url(#fur)"
             stroke="#1E3B64" stroke-width="17"/>

    <!-- 볼터치 -->
    <ellipse cx="146" cy="352" rx="40" ry="27" fill="url(#blush)"/>
    <ellipse cx="366" cy="352" rx="40" ry="27" fill="url(#blush)"/>

    <!-- 눈 — 얼굴 가운데보다 아래, 넓게 -->
    <g fill="#151A20">
      <ellipse cx="196" cy="318" rx="28" ry="33"/>
      <ellipse cx="316" cy="318" rx="28" ry="33"/>
    </g>
    <g fill="#FFFFFF">
      <circle cx="206" cy="305" r="10.5"/>
      <circle cx="188" cy="330" r="5"/>
      <circle cx="326" cy="305" r="10.5"/>
      <circle cx="308" cy="330" r="5"/>
    </g>

    <!-- 아주 작은 코와 입 -->
    <path d="M247 356 L265 356 Q269 356 267 360 L259 370 Q256 373 253 370 L245 360 Q243 356 247 356 Z"
          fill="#E4726B"/>
    <path d="M256 373 Q256 386 243 386 M256 373 Q256 386 269 386"
          fill="none" stroke="#151A20" stroke-width="8" stroke-linecap="round"/>

    <!-- 수염 — 짧게 -->
    <g stroke="#B7C4D6" stroke-width="9" stroke-linecap="round" fill="none">
      <path d="M112 306 L66 296"/>
      <path d="M112 336 L68 342"/>
      <path d="M400 306 L446 296"/>
      <path d="M400 336 L444 342"/>
    </g>
  </g>
</svg>
